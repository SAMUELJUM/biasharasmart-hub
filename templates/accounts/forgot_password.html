<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - BiasharaSmart Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f1117; --paper: #f8f7f2; --accent: #2d6a4f;
            --accent-light: #40916c; --accent-pale: #d8f3dc;
            --gold: #e9c46a; --error: #c1121f; --error-pale: #fce4e4;
            --muted: #6b7280; --border: #e2e0d8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--paper);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.5;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            top: -120px;
            right: -120px;
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #d8f3dc 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            animation: rise 0.6s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--gold);
            color: var(--ink);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 5px 12px;
            border-radius: 2px;
            margin-bottom: 24px;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 40px;
            box-shadow:
                0 1px 2px rgba(0,0,0,0.04),
                0 8px 32px rgba(0,0,0,0.06),
                4px 4px 0 0 var(--accent);
        }

        .icon-wrap {
            position: relative;
            width: 64px;
            height: 64px;
            margin: 0 auto 28px;
        }
        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent-pale);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            position: relative;
            z-index: 1;
        }
        .icon-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0;
            animation: pulse-ring 2s ease-out infinite;
        }
        .icon-ring:nth-child(2) { animation-delay: 0.5s; }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .card-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.03em;
            line-height: 1.2;
            margin-bottom: 6px;
        }
        .card-header p {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
        }

        .alert {
            display: none;
            align-items: flex-start;
            gap: 10px;
            padding: 11px 14px;
            border-radius: 3px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .alert.show { display: flex; animation: fade-in 0.2s ease; }
        .alert-error { background: var(--error-pale); color: var(--error); border-left: 3px solid var(--error); }
        .alert-success { background: var(--accent-pale); color: var(--accent); border-left: 3px solid var(--accent); }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 3px;
            font-size: 15px;
            font-family: 'DM Mono', monospace;
            color: var(--ink);
            background: var(--paper);
            transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
        }
        input::placeholder { color: #b0aca0; }
        input:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(45,106,79,0.1);
        }
        .input-hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 5px;
            font-family: 'DM Mono', monospace;
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 3px;
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            margin-top: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn-submit::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 60%);
            pointer-events: none;
        }
        .btn-submit:hover:not(:disabled) {
            background: var(--accent-light);
            box-shadow: 0 4px 12px rgba(45,106,79,0.3);
            transform: translateY(-1px);
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .steps-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
        }
        .step {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .step.active { color: var(--accent); }
        .step-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
        }
        .step.active .step-dot {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .step-line { flex: 1; height: 1px; background: var(--border); max-width: 32px; }

        .footer-links {
            margin-top: 24px;
            display: flex;
            justify-content: center;
        }
        .footer-links a {
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.15s;
        }
        .footer-links a:hover { color: var(--accent); }
    </style>
</head>
<body>
<div class="container">
    <div class="badge">🇰🇪 Kenyan SME Platform</div>

    <div class="card">
        <div class="icon-wrap">
            <div class="icon-ring"></div>
            <div class="icon-ring"></div>
            <div class="icon-circle">🔐</div>
        </div>

        <div class="card-header">
            <h1>Reset your password</h1>
            <p>Enter your registered phone number and we'll send you a verification code</p>
        </div>

        <!-- Step indicators -->
        <div class="steps-row">
            <div class="step active">
                <div class="step-dot">1</div>
                Phone
            </div>
            <div class="step-line"></div>
            <div class="step">
                <div class="step-dot">2</div>
                Verify
            </div>
            <div class="step-line"></div>
            <div class="step">
                <div class="step-dot">3</div>
                New Password
            </div>
        </div>

        {% if error %}
        <div class="alert alert-error show">⚠️ {{ error }}</div>
        {% endif %}

        <form method="POST" action="/forgot-password/" id="forgotForm">
            {% csrf_token %}
            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input
                    type="tel"
                    id="phone_number"
                    name="phone_number"
                    placeholder="254712345678"
                    autocomplete="tel"
                    required
                    autofocus
                >
                <div class="input-hint">Format: 254XXXXXXXXX</div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">Send Verification Code</span>
            </button>
        </form>
    </div>

    <div class="footer-links">
        <a href="/login/">← Back to sign in</a>
    </div>
</div>

<script>
document.getElementById('forgotForm').addEventListener('submit', function() {
    const btn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    btn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = 'Sending…';
});
</script>
</body>
</html>
